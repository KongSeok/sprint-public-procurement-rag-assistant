[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "midprojectrag"
version = "0.1.0"
description = "Reproducible RFP ingestion, RAG contracts, and evaluation tooling"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=6,<7",
]

[project.optional-dependencies]
pdf-fidelity = [
  "pdfplumber>=0.11,<0.12",
]

[project.scripts]
midprojectrag = "midprojectrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
