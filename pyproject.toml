[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "midprojectrag"
version = "0.1.0"
description = "Reproducible RFP ingestion, RAG contracts, and evaluation tooling"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=6,<7",
]

[project.optional-dependencies]
hwp = [
  "pyhwp==0.1b15",
  "six>=1.17,<2",
]
pdf-fidelity = [
  "pdfplumber>=0.11,<0.12",
  "Pillow>=12,<13",
  "pypdfium2>=5,<6",
]
visual-fidelity = [
  "Pillow>=12,<13",
]
test = [
  "jsonschema>=4.23,<5",
  "referencing>=0.35,<1",
]
rag = [
  "numpy>=2,<3",
  "openai>=3.2,<4",
  "python-dotenv==1.2.3",
  "tiktoken==0.13.0",
]
gcp-local = [
  "huggingface-hub>=0.34,<2",
  "numpy>=2,<3",
  "sentence-transformers>=5,<6",
  "torch>=2.8,<3; platform_system == 'Darwin'",
  "torch==2.6.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "transformers>=4.55,<5",
  "faiss-cpu==1.15.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "vllm==0.8.5.post1; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
faiss = [
  "faiss-cpu==1.15.0; platform_system != 'Darwin' or platform_machine != 'arm64'",
]
observability = [
  "langfuse==4.14.5",
  "python-dotenv==1.2.3",
]
ui = [
  "streamlit>=1.41,<2",
]

[project.scripts]
midprojectrag = "midprojectrag.cli:main"
midprojectrag-eval = "midprojectrag.evaluation:main"
midprojectrag-supplemental-eval = "midprojectrag.supplemental_evaluation:main"
midprojectrag-supplemental-baseline = "midprojectrag.supplemental_baseline:main"
midprojectrag-gcp-local-baseline = "midprojectrag.gcp_local_baseline:main"

[tool.setuptools.packages.find]
where = ["src"]
